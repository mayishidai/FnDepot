version: "3.8"

services:
  octop:
    # 官方镜像，amd64 + arm64 多架构，Docker 会按本机架构拉对应层。
    # 钉版本而不是 latest：升级时在 manifest 与本行同步改，避免「重启拉到别的版本」。
    image: ghcr.io/tencentcloud/octop:1.0.2
    container_name: octop
    restart: unless-stopped
    pull_policy: missing
    ports:
      # {host_port} 是飞牛应用中心注入的宿主机端口占位符，写死 8088 容易撞车
      - "{host_port}:8088"
    volumes:
      # 整个 /data 挂到 data-share（config/resource 声明的 data），
      # OCTOP_HOME=/data/.octop 与 credential.txt 都落在这里，卸载应用不丢数据。
      - "/var/apps/octop/shares/data:/data"
    # ------------------------------------------------------------------
    # 入口垫片
    #
    # 官方 entrypoint 只认 OCTOP_ADMIN_USERNAME / OCTOP_DEFAULT_PASSWORD 这几个
    # **环境变量**，而飞牛安装向导的值只能由 cmd/install_callback 落盘。
    # 官方自己的 fnOS 包试过把值写进 compose 同级的 .env、靠 ${VAR} 插值读进去，
    # 结论是读不到（.env 不在 @appcenter 的 compose 工作目录）—— 见其
    # fnos/docker/app/docker/docker-compose.yaml 顶部的注释。
    #
    # 所以这里绕开插值：凭据写进已挂载的 /data/fnos-admin.env，垫片逐行读入后
    # 再 exec 回官方入口脚本。文件不存在时什么都不做，官方逻辑照样跑
    # （此时它自己生成 16 位随机密码，写进 /data/.octop/credential.txt）。
    #
    # 刻意用 `read` 而不是 `. 文件`：后者会把密码当 shell 源码再解析一遍，
    # 密码里带 $ ' " 就会被吃掉。read 出来的值原样 export，不含任何求值。
    # ------------------------------------------------------------------
    entrypoint:
      - bash
      - -c
      - |
        if [ -f /data/fnos-admin.env ]; then
          while IFS='=' read -r key val; do
            case "$key" in
              OCTOP_ADMIN_USERNAME|OCTOP_ADMIN_DISPLAY_NAME|OCTOP_DEFAULT_PASSWORD)
                [ -n "$val" ] && export "$key=$val" ;;
            esac
          done < /data/fnos-admin.env
        fi
        if command -v docker-entrypoint.sh >/dev/null 2>&1; then
          exec docker-entrypoint.sh
        fi
        exec /usr/local/bin/docker-entrypoint.sh
    environment:
      # 全部写死，不做 ${...} 插值 —— 少一处依赖就少一处「值变空串」的可能。
      - HOME=/data
      - OCTOP_HOME=/data/.octop
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=8088
      - OCTOP_LOG_LEVEL=info
      - TZ=Asia/Shanghai
