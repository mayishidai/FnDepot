version: '3.8'
# 飞牛手动部署用（不走 FPK 时）：
# 1) docker pull ghcr.io/mayishidai/agnes-ai-studio:latest
# 2) 在飞牛“容器”中导入本 compose，或 docker compose up -d
# 镜像需先在 Agnes AI Studio 主仓库启用 GitHub Actions 自动构建发布
services:
  agnes-ai-studio:
    image: ghcr.io/mayishidai/agnes-ai-studio:latest
    container_name: agnes-ai-studio
    ports:
      - "5000:5000"
    volumes:
      - ./data/config.json:/app/config.json
      - ./data/videos:/app/videos
      - ./data/pictures:/app/pictures
      - ./data/dramas:/app/dramas
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
