name: Build & Release FPK

# 打 tag vX.Y.Z 即自动：
#   1) 扫描 packages/ 下的应用，并筛出相对上一个 tag 有改动的
#   2) 逐个构建 fpk → 3) 回填 sha256/size → 4) 按 V2 规范校验
#   5) 提交元数据 → 6) 发布 GitHub Release
#
# 只构建「有改动」的应用：某个应用没动就不会被重新打包、不会平白多出一个版本。
# 新增应用首次打 tag 会被视为有改动，自动纳入。需要全量重建时用 workflow_dispatch 的 force_all。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.1.0），需已存在'
        required: true
      force_all:
        description: '强制构建全部应用（忽略改动检测）'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FNPACK_VERSION: "1.2.3"
  FNPACK_SHA256: "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"

jobs:
  # ---------- 第一步：发现应用，产出 matrix ----------
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.scan.outputs.apps }}
      has_apps: ${{ steps.scan.outputs.has_apps }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag & version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Discover changed apps
        id: scan
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          FORCE: ${{ github.event.inputs.force_all }}
        run: |
          APPS=$(python3 - <<'PY'
          import json, os, subprocess, sys

          force = (os.environ.get("FORCE") or "").lower() == "true"
          tag = os.environ["TAG"]

          # 相对上一个 tag 的改动文件清单；没有上一个 tag 则视为全部改动
          prev = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "--exclude", tag, f"{tag}^"],
              capture_output=True, text=True,
          ).stdout.strip()
          if force or not prev:
              changed = None
              reason = "强制全量" if force else "无上一个 tag"
              print(f"::notice::基准 = {reason}，纳入全部应用", file=sys.stderr)
          else:
              changed = set(subprocess.run(
                  ["git", "diff", "--name-only", prev, tag],
                  capture_output=True, text=True,
              ).stdout.split())
              print(f"::notice::基准 tag = {prev}", file=sys.stderr)

          found, skipped = [], []
          for appid in sorted(os.listdir("packages")):
              d = os.path.join("packages", appid)
              if not os.path.isdir(d):
                  continue
              if not os.path.exists(os.path.join(d, "manifest")):
                  print(f"::warning::{appid} 缺少 manifest，跳过", file=sys.stderr)
                  continue
              if not os.path.exists(os.path.join("apps", f"{appid}.json")):
                  print(f"::warning::apps/{appid}.json 不存在，跳过", file=sys.stderr)
                  continue
              # 改动判定：FPK 工程目录或该应用的镜像源码目录命中即算有改动
              touched = changed is None or any(
                  f.startswith(f"packages/{appid}/") or f.startswith(f"src/{appid}/")
                  for f in changed
              )
              (found if touched else skipped).append(appid)

          if skipped:
              print(f"::notice::无改动，跳过：{', '.join(skipped)}", file=sys.stderr)
          print(json.dumps(found))
          PY
          )
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          if [ "$APPS" = "[]" ]; then
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Apps to build: $APPS"

  # ---------- 第二步：逐应用构建并回填元数据 ----------
  build:
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified fnpack
        run: |
          URL="https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          curl -fsSL -o fnpack "$URL"
          ACTUAL=$(sha256sum fnpack | awk '{print $1}')
          if [ "$ACTUAL" != "$FNPACK_SHA256" ]; then
            echo "::error::fnpack sha256 mismatch (got $ACTUAL)"
            exit 1
          fi
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: Stamp version into manifest
        run: |
          MANIFEST="packages/${{ matrix.app }}/manifest"
          sed -i "s/^\(version[[:space:]]*=\).*/\1 ${{ needs.discover.outputs.version }}/" "$MANIFEST"
          grep '^version' "$MANIFEST"

      - name: Build FPK
        run: |
          cd "packages/${{ matrix.app }}"
          fnpack build
          ls -la *.fpk

      - name: Compute checksum & size
        id: pkg
        run: |
          FPK="packages/${{ matrix.app }}/${{ matrix.app }}.fpk"
          test -f "$FPK" || { echo "::error::未找到 $FPK"; exit 1; }
          echo "path=$FPK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$FPK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$FPK")" >> "$GITHUB_OUTPUT"

      - name: Update release metadata
        run: |
          python3 scripts/update_release_meta.py \
            --app "${{ matrix.app }}" \
            --version "${{ needs.discover.outputs.version }}" \
            --tag "${{ needs.discover.outputs.tag }}" \
            --sha "${{ steps.pkg.outputs.sha }}" \
            --size "${{ steps.pkg.outputs.size }}"

      - name: Verify source against FnDepot V2 spec
        run: python3 scripts/verify_source.py

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.app }}
          path: ${{ steps.pkg.outputs.path }}

      - name: Upload staged metadata
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}.json
            packages/${{ matrix.app }}/manifest
            fnpack.json

  # ---------- 第三步：汇总提交元数据（单点写入，避免多 job 抢推） ----------
  commit-metadata:
    needs: [discover, build]
    if: needs.discover.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all staged metadata
        uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: staged

      - name: Apply metadata back to working tree
        run: |
          shopt -s globstar nullglob
          for f in staged/**/apps/*.json; do
            [ -e "$f" ] || continue
            dest="apps/$(basename "$f")"
            cp "$f" "$dest"
            echo "applied $dest"
          done
          for f in staged/**/packages/*/manifest; do
            [ -e "$f" ] || continue
            appid="$(basename "$(dirname "$f")")"
            dest="packages/$appid/manifest"
            cp "$f" "$dest"
            echo "applied $dest"
          done

      # 每个 matrix job 各自从干净检出出发，生成的 fnpack.json 都只含「自己那一个」新条目，
      # 直接 cp 会互相覆盖（后写的那份把先前的条目抹掉），所以这里改成按 id 合并。
      # 之前正是漏了这一步，导致新应用首次发布时 ensure_indexed() 的索引改动被静默丢弃。
      - name: Merge new index entries
        run: |
          python3 - <<'PY'
          import glob, json, pathlib
          path = pathlib.Path("fnpack.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          apps = data.setdefault("apps", {})
          added = []
          for staged in sorted(glob.glob("staged/**/fnpack.json", recursive=True)):
              incoming = json.loads(pathlib.Path(staged).read_text(encoding="utf-8"))
              for appid, entry in (incoming.get("apps") or {}).items():
                  if appid not in apps:
                      apps[appid] = entry
                      added.append(appid)
          if added:
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                              encoding="utf-8")
              print("已登记索引：" + ", ".join(added))
          else:
              print("索引无新增条目")
          PY

      - name: Verify source against FnDepot V2 spec
        run: python3 scripts/verify_source.py

      - name: Commit metadata back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps packages/*/manifest fnpack.json
          if git diff --cached --quiet; then
            echo "no metadata changes"
          else
            git commit -m "chore(release): ${{ needs.discover.outputs.version }} 元数据回填"
            git push origin HEAD:main
          fi

  # ---------- 第四步：发布 Release（汇总本次构建的 fpk） ----------
  release:
    needs: [discover, build]
    if: needs.discover.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all FPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fpk-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Build release body
        id: body
        env:
          APPS: ${{ needs.discover.outputs.apps }}
        run: |
          BODY=$(python3 - <<'PY'
          import json, os

          apps = json.loads(os.environ["APPS"])
          lines = ["| 应用 | 安装包 | 大小 |", "| --- | --- | --- |"]
          for name in apps:
              f = f"dist/{name}.fpk"
              size = f"{os.path.getsize(f):,} B" if os.path.exists(f) else "—"
              lines.append(f"| `{name}` | `{name}.fpk` | {size} |")
          print("\n".join(lines))
          PY
          )
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "## 发布 ${{ needs.discover.outputs.version }}"
            echo ""
            echo "$BODY"
            echo ""
            echo "### 安装方式"
            echo "飞牛 fnOS「应用中心」→ 开启手动安装 → 上传对应 \`.fpk\`。"
            echo ""
            echo "### 文件校验"
            echo "每个 \`.fpk\` 的 SHA256 与大小已由 CI 回填至仓库 \`apps/<appid>.json\`，"
            echo "客户端会做强制校验，请勿手工修改已发布版本的任何字段。"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.discover.outputs.tag }}
          files: dist/*.fpk
          name: ${{ needs.discover.outputs.tag }}
          body: ${{ steps.body.outputs.body }}
          draft: false
          prerelease: false
