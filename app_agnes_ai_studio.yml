# 飞牛 FPK 应用清单模板（fnpack 输入）
# 用法：在装有飞牛 fnpack 工具的机器上执行
#   fnpack build app_agnes_ai_studio.yml
# 生成 agnes-ai-studio.fpk 后，上传到本仓库的 GitHub Release（建议 tag v1.0.0）
#
# 注意：volumes / ports / env 等字段以飞牛官方文档为准，
# 参考 https://developer.fnnas.com/docs/core-concepts/framework/
# 镜像地址需先发布（见 README “发布镜像”一节）

appid: agnes-ai-studio
name: Agnes AI Studio
version: 1.0.0
image: ghcr.io/mayishidai/agnes-ai-studio:latest

# 容器端口（应用监听 5000，飞牛通过反向代理暴露）
ports:
  - 5000

environment:
  - PYTHONUNBUFFERED=1

# 持久化：配置与生成的数据（路径与代码 ensure_output_dirs 一致）
volumes:
  - /app/config.json:/app/config.json
  - /app/videos:/app/videos
  - /app/pictures:/app/pictures
  - /app/dramas:/app/dramas

privileged: false
restart: unless-stopped
